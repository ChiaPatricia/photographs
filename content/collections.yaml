05-aurora:
  # iPhone, 10 October 2024, 22:01–22:14 EDT, during a G4 ("severe") geomagnetic storm.
  # Near-duplicates held back: IMG_6885 (IMG_6884 twelve seconds later), IMG_6886 and IMG_6900
  # (the same horizon as IMG_6876).
  slug: slow
  status: draft
  emoji: 🌌
  color: yellow
  behaviour: slow
  word:
    en: Slow
    zh: 慢
  sentence:
    en: This red comes from oxygen that takes about two minutes to glow; only very high up, where the air is thin, can it wait that long.
    zh: 这种红光来自氧原子，它要等大约两分钟才发光；只有在很高、空气很稀薄的地方，它才等得起。
  place:
    en: Maine
    zh: 缅因州
  sequence:
    - { file: IMG_6884.JPG, layout: large, align: left }
    - { file: IMG_6876.JPG, layout: full }
    - { file: IMG_6896.JPG, layout: medium, align: right }
    - { file: IMG_6898.JPG, layout: small, align: left }
  photos:
    IMG_6884.JPG:
      alt: { en: "Red and green aurora over pine trees, a power pole and its wires in silhouette.", zh: "松树上空红绿相间的极光，电线杆和电线成了剪影。" }
      note: { en: "It began two days earlier, at almost the same time of night, with an eruption on the sun.", zh: "两天前差不多同一时刻，太阳上发生了一次爆发，这场极光就是它引起的。" }
    IMG_6876.JPG:
      alt: { en: "Curtains of green and red aurora above a dark horizon with a few distant lights.", zh: "漆黑的地平线上方，绿色和红色的极光像帘子一样垂下，远处有几点灯光。" }
      note: { en: "The green is oxygen too, lower down, about a hundred kilometres up, and it glows within about a second.", zh: "绿光也来自氧原子，位置低一些，大约一百公里高，一秒左右就发出来。" }
    IMG_6896.JPG:
      alt: { en: "A person seen from behind, in silhouette, watching a green aurora; pines on the right.", zh: "一个人的背影，望着绿色的极光，右边是松树。" }
    IMG_6898.JPG:
      alt: { en: "Looking straight up into a band of red aurora among the stars.", zh: "抬头直看，一道红色的极光横在星星之间。" }
